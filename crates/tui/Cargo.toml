[package]
name = "treetop-tui"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "treetop in a terminal: an htop-style process tree with GPU, containers, sensors and per-process network"

[[bin]]
name = "treetop-tui"
path = "src/main.rs"

[dependencies]
treetop-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
libc = "0.2"
unicode-width = "0.2"

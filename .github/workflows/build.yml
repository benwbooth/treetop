name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: nix build -L .#default
      - name: Smoke test
        run: |
          ./result/bin/treetop --help
          ./result/bin/treetop-tui --self-test
      - name: Terminal version
        run: nix build -L .#treetop-tui -o result-tui && ./result-tui/bin/treetop-tui --version

  tui:
    name: Terminal static (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tui-${{ matrix.arch }}
      - name: Build
        run: cargo build -p treetop-tui --profile release-tui --locked --target "$TARGET"
      - name: Check it's static and runs
        run: |
          f="target/$TARGET/release-tui/treetop-tui"
          file "$f"
          file "$f" | grep -q 'static'
          "$f" --version
          "$f" --self-test
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || v="$(git rev-parse --short HEAD)"
          cp "$f" "treetop-tui-$v-${{ matrix.arch }}-linux-musl"
      - uses: actions/upload-artifact@v4
        with:
          name: treetop-tui-${{ matrix.arch }}
          path: treetop-tui-*-linux-musl
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: treetop-tui-*-linux-musl

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1-dev libfreetype-dev libdbus-1-dev file librsvg2-bin

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo build -p treetop --release --locked

      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          EXTRA_QT_MODULES: "waylandclient"
          EXTRA_PLATFORM_PLUGINS: "libqwayland-generic.so;libqwayland-egl.so"
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mkdir -p AppDir/usr/share/plasma/plasmoids
          cp -R plasmoid AppDir/usr/share/plasma/plasmoids/com.benwbooth.treetop
          export LINUXDEPLOY_OUTPUT_VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || LINUXDEPLOY_OUTPUT_VERSION="$(git rev-parse --short HEAD)"
          # appimagetool wants a PNG icon for .DirIcon
          rsvg-convert -w 256 -h 256 resources/treetop.svg -o treetop.png
          ./linuxdeploy --appdir AppDir \
            -e target/release/treetop \
            -d resources/treetop.desktop \
            -i resources/treetop.svg -i treetop.png \
            --plugin qt --output appimage
          ls -la *.AppImage
          ./treetop-*-x86_64.AppImage --help

      - uses: actions/upload-artifact@v4
        with:
          name: treetop-appimage
          path: treetop-*-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: treetop-*-x86_64.AppImage
          generate_release_notes: true

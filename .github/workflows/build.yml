name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build
        run: nix build -L .#default
      - name: Smoke test
        run: ./result/bin/treetop --help

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1-dev libfreetype-dev libdbus-1-dev file

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo build --release --locked

      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          EXTRA_QT_MODULES: "waylandclient"
          EXTRA_PLATFORM_PLUGINS: "libqwayland-generic.so;libqwayland-egl.so"
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mkdir -p AppDir/usr/share/plasma/plasmoids
          cp -R plasmoid AppDir/usr/share/plasma/plasmoids/com.benwbooth.treetop
          export VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          ./linuxdeploy --appdir AppDir \
            -e target/release/treetop \
            -d resources/treetop.desktop \
            -i resources/treetop.svg \
            --plugin qt --output appimage
          ls -la *.AppImage
          mv treetop-*.AppImage "treetop-${VERSION}-x86_64.AppImage"
          ./treetop-*-x86_64.AppImage --help

      - uses: actions/upload-artifact@v4
        with:
          name: treetop-appimage
          path: treetop-*-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: treetop-*-x86_64.AppImage
          generate_release_notes: true
